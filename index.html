<style>
  :root{
    --paper:#2B3B33;
    --surface:#33453C;
    --surface-done:#3A4D42;
    --ink:#EDEDE3;
    --muted:#A9B3AC;
    --hairline:#45584E;
    --accent:#E8C547;
    --accent-soft:#4F4A2E;
    --warn:#E2735A;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:64px;
  }
  h1,h2,h3,.eyebrow,.card-label{
    font-family:'Caveat',cursive;
    font-weight:600;
  }
  .tick-num{font-family:'Space Mono',monospace;}
  .mono{
    font-family:'Space Mono',ui-monospace,monospace;
    font-variant-numeric:tabular-nums;
  }
  h1,h2,h3,p{text-wrap:balance;}

  header.top{
    position:sticky;top:0;z-index:10;
    background:var(--paper);
    padding:18px 20px 14px;
    border-bottom:1px solid var(--hairline);
  }
  .title{
    font-weight:700;font-size:34px;letter-spacing:.01em;
    margin:0;
  }
  .sub{
    display:flex;flex-wrap:wrap;gap:6px 14px;
    margin-top:6px;color:var(--muted);font-size:13.5px;
  }
  .sub .accent{color:var(--accent);font-weight:600;}
  .progress-line{
    margin-top:8px;font-size:12.5px;color:var(--muted);
  }

  /* Km-marker week rail */
  nav.rail{
    display:flex;gap:2px;overflow-x:auto;padding:16px 12px 4px;
    scroll-snap-type:x proximity;
    position:relative;
  }
  nav.rail::-webkit-scrollbar{display:none;}
  .tick{
    scroll-snap-align:center;
    flex:0 0 auto;width:44px;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:6px 0 10px;background:none;border:none;cursor:pointer;
    color:var(--muted);
  }
  .tick .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--hairline);
    border:2px solid var(--hairline);
  }
  .tick .tick-num{font-size:14px;font-weight:700;}
  .tick.active .dot{background:var(--accent);border-color:var(--accent);}
  .tick.active{color:var(--ink);}
  .tick.done .dot{background:var(--accent);border-color:var(--accent);opacity:.55;}
  .tick-line{
    position:absolute;left:20px;right:20px;top:29px;height:1px;
    background:var(--hairline);z-index:-1;
  }

  main{padding:18px 20px 0;max-width:640px;margin:0 auto;}

  .week-head{margin-bottom:14px;}
  .eyebrow{
    text-transform:uppercase;letter-spacing:.06em;font-size:13px;
    color:var(--accent);font-weight:600;margin:0 0 2px;
  }
  .week-title{font-size:22px;font-weight:600;margin:0;}
  .week-dates{color:var(--muted);font-size:13.5px;margin-top:2px;}

  .strava-row{
    display:flex;align-items:center;gap:10px;margin:14px 0 6px;flex-wrap:wrap;
  }
  button.strava-btn{
    font-family:'Work Sans',sans-serif;font-size:13.5px;font-weight:600;
    background:var(--surface);color:var(--accent);
    border:1px solid var(--accent);border-radius:999px;
    padding:8px 16px;cursor:pointer;
  }
  button.strava-btn:active{background:var(--accent-soft);}
  button.strava-btn:disabled{opacity:.6;cursor:default;}
  .strava-status{font-size:13px;color:var(--muted);}
  .strava-status.err{color:var(--warn);}

  .candidates{
    display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px;
  }
  .chip{
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;
    background:var(--accent-soft);color:var(--accent);
    border:none;border-radius:8px;padding:7px 10px;cursor:pointer;
  }
  .chip:active{opacity:.8;}

  .card{
    background:var(--surface);border:1px solid var(--hairline);
    border-radius:var(--radius);padding:16px;margin-bottom:12px;
    transition:border-color .15s, background-color .15s;
  }
  .card.done{
    background:var(--surface-done);border:2px solid var(--accent);
  }
  .card.done .card-label{
    text-decoration:line-through;text-decoration-color:var(--accent);
    text-decoration-thickness:2px;
  }
  .card-top{
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  }
  .card-label{font-size:19px;margin:0;}
  .status{font-size:12.5px;color:var(--muted);white-space:nowrap;font-family:'Work Sans';}
  .status.on{color:var(--accent);font-weight:600;}
  .card-target{color:var(--muted);font-size:14px;margin:6px 0 0;line-height:1.45;}
  .card-pace{color:var(--accent);font-size:13px;margin:6px 0 0;font-weight:700;}
  .card-hr{color:var(--muted);font-size:12.5px;margin:3px 0 0;}
  .race-card .card-pace{color:#F3D97A;}
  .race-card .card-hr{color:#B7C2BA;}

  .outing{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(62px,1fr));
    gap:12px 6px;margin-top:14px;padding:14px 10px;
    background:var(--accent-soft);border-radius:8px;
  }
  .outing .stat{text-align:center;}
  .outing .val{
    font-family:'Space Mono',monospace;font-size:18px;font-weight:700;
    color:var(--accent);display:block;
  }
  .outing .lab{
    font-size:10px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.03em;margin-top:3px;display:block;
  }
  .race-card .outing{background:#4A4527;}
  .race-card .outing .lab{color:#C9D2CB;}

  .card-foot{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--hairline);
    flex-wrap:wrap;
  }
  label.manual{
    display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink);
    cursor:pointer;
  }
  input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);}
  .result{
    font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--accent);
  }
  .clear-link{
    font-size:12.5px;color:var(--muted);background:none;border:none;
    text-decoration:underline;cursor:pointer;padding:0;
  }

  .race-card{
    background:#3D4E42;border:2px solid var(--accent);
  }
  .race-card .card-label{color:var(--accent);}
  .race-card .card-target{color:#C9D2CB;}
  .race-card .status{color:#C9D2CB;}
  .race-card .status.on{color:var(--accent);}
  .race-card button.strava-btn{background:transparent;color:var(--accent);border-color:var(--accent);}
  .race-card .card-foot{border-top-color:#4C5F53;}
  .race-card .chip{background:#4A4527;color:#F3D97A;}
  .race-card .result{color:var(--accent);}

  .goal-note{
    margin-top:10px;font-size:13.5px;font-weight:600;
  }

  .help{
    font-size:12.5px;color:var(--muted);margin:0 0 16px;
    padding-bottom:12px;border-bottom:1px solid var(--hairline);
  }

  .modal-overlay{
    position:fixed;inset:0;background:rgba(10,14,12,.6);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;
  }
  .modal-box{
    background:var(--surface);border:1px solid var(--hairline);
    border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:480px;
    max-height:75vh;overflow-y:auto;
  }
  @media (min-width:520px){
    .modal-overlay{align-items:center;}
    .modal-box{border-radius:16px;}
  }
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .modal-head h3{font-family:'Caveat';font-size:22px;margin:0;font-weight:600;}
  .modal-close{
    background:none;border:none;color:var(--muted);font-size:16px;
    cursor:pointer;padding:4px 8px;
  }
  .modal-item{
    display:block;width:100%;text-align:left;
    background:var(--paper);border:1px solid var(--hairline);border-radius:8px;
    padding:12px 14px;margin-bottom:8px;font-family:'Space Mono';font-size:13.5px;
    color:var(--ink);cursor:pointer;
  }
  .modal-item:active{border-color:var(--accent);}
  .modal-empty,.modal-loading,.modal-error{
    font-family:'Work Sans';font-size:14px;color:var(--muted);padding:6px 0 12px;
  }
  .modal-error{color:var(--warn);}
  .strava-btn.small{
    font-size:12.5px;padding:6px 12px;
  }
</style>
</head>

<header class="top">

  <div id="week-panel"></div>
</main>

<div class="modal-overlay" id="modal-overlay" style="display:none;">

    </div>
    <div id="modal-body"></div>

</div>

  const weekStravaStatus = {}; // ephemeral, not persisted: {text, err}

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      state = raw ? JSON.parse(raw) : {};
    }catch(e){
      state = {};
    }
  }
  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ /* silent: state stays correct in memory for this session */ }
  }

  function allSessionIds(week){
    const ids = week.sessions.map(s=>s.id);
    if(week.raceSession) ids.push(week.raceSession.id);
    return ids;
  }

  function weekDone(week){
    const ids = allSessionIds(week);
    const done = ids.filter(id => state[id] && state[id].checked).length;
    return {done, total: ids.length};
  }

  function usedCandidateKeys(week){
    const used = new Set();
    allSessionIds(week).forEach(id=>{
      const s = state[id];
      if(s && s.checked && s.source==='strava' && s.date){
        used.add(s.date+'|'+s.distance_km.toFixed(2));
      }
    });
    return used;
  }

  function pickCurrentWeek(){
    const today = new Date();
    for(const w of PLAN){
      if(today >= new Date(w.start+'T00:00:00') && today <= new Date(w.end+'T23:59:59')) return w.n;
    }
    if(today < new Date(PLAN[0].start)) return 1;
    return 12;
  }

  function renderCountdown(){
    const today = new Date();
    const diff = Math.ceil((RACE_DATE - today)/86400000);
    document.getElementById('countdown').textContent =
      diff > 0 ? `Faltan ${diff} días` : (diff === 0 ? 'Hoy es el día' : 'Carrera completada');

    let doneTotal=0, all=0;
    PLAN.forEach(w=>{ const {done,total}=weekDone(w); doneTotal+=done; all+=total; });
    document.getElementById('progress-line').textContent = `${doneTotal}/${all} sesiones completadas`;

    const stravaLine = document.getElementById('strava-status-line');
    if(isStravaConnected()){
      stravaLine.innerHTML = '<span style="color:var(--accent)">● Conectado a Strava</span>';
    } else {
      stravaLine.innerHTML = '<button class="strava-btn small" id="connect-strava-btn">Conectar con Strava</button>';
      const btn = document.getElementById('connect-strava-btn');
      if(btn) btn.onclick = redirectToStravaAuth;
    }
  }

  function renderRail(){
    const rail = document.getElementById('rail');
    rail.querySelectorAll('.tick').forEach(t=>t.remove());
    PLAN.forEach(w=>{
      const {done,total} = weekDone(w);
      const btn = document.createElement('button');
      btn.className = 'tick' + (w.n===currentWeek?' active':'') + (done===total?' done':'');
      btn.innerHTML = `<span class="dot"></span><span class="tick-num">${w.n}</span>`;
      btn.onclick = ()=>{ currentWeek = w.n; renderAll(); };
      rail.appendChild(btn);
    });
  }

  function formatCandidate(c){
    const d = new Date(c.date+'T00:00:00');
    const dd = d.toLocaleDateString('es-ES',{day:'numeric',month:'short'});
    return `${dd} · ${c.distance_km.toFixed(2)}km · ${c.pace_min_km}/km`;
  }

  function sessionCard(sess, week, isRace){
    const st = state[sess.id] || {};
    const card = document.createElement('div');
    card.className = 'card' + (isRace ? ' race-card' : '') + (st.checked ? ' done' : '');

    const top = document.createElement('div');
    top.className = 'card-top';
    const statusText = st.checked ? (st.source==='strava' ? '' : 'Hecho') : 'Pendiente';
    top.innerHTML = `<p class="card-label">${sess.label}</p>
      ${statusText ? `<span class="status ${st.checked?'on':''}">${statusText}</span>` : ''}`;
    card.appendChild(top);

    const target = document.createElement('p');
    target.className = 'card-target';
    target.textContent = sess.target;
    card.appendChild(target);

    if(sess.pace){
      const pace = document.createElement('p');
      pace.className = 'card-pace mono';
      pace.textContent = sess.pace;
      card.appendChild(pace);
    }
    if(sess.hr){
      const hr = document.createElement('p');
      hr.className = 'card-hr mono';
      hr.textContent = sess.hr;
      card.appendChild(hr);
    }

    if(isRace && st.checked && st.pace_min_km){
      const [m,s] = st.pace_min_km.split(':').map(Number);
      const goalMet = (m*60+s) <= (4*60+20);
      const note = document.createElement('p');
      note.className = 'goal-note';
      note.style.color = goalMet ? '#8FD9A8' : '#E2A46B';
      note.textContent = goalMet ? 'Objetivo cumplido — bajaste de 4:20/km.' : 'Por encima de 4:20/km esta vez.';
      card.appendChild(note);
    }

    const foot = document.createElement('div');
    foot.className = 'card-foot';

    const label = document.createElement('label');
    label.className = 'manual';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!st.checked;
    cb.onchange = ()=>{
      if(cb.checked){
        state[sess.id] = {checked:true, source:'manual'};
      } else {
        delete state[sess.id];
      }
      saveState(); renderAll();
    };
    label.appendChild(cb);
    label.append(' Marcar a mano');
    foot.appendChild(label);

    if(!(st.checked && st.source==='strava')){
      const stravaBtn = document.createElement('button');
      stravaBtn.className = 'strava-btn small';
      stravaBtn.textContent = isStravaConnected() ? 'Comprobar en Strava' : 'Conectar con Strava';
      stravaBtn.onclick = ()=> showStravaModal(sess, week);
      foot.appendChild(stravaBtn);
    }

    card.appendChild(foot);

    if(st.checked && st.source==='strava'){
      const stats = [
        {val: st.distance_km.toFixed(2), lab:'km'},
        {val: st.pace_min_km, lab:'min/km'},
        {val: st.duration, lab:'duración'},
        {val: st.elevation_gain_m!=null ? Math.round(st.elevation_gain_m)+'m' : null, lab:'desnivel'},
        {val: st.cadence_spm!=null ? Math.round(st.cadence_spm) : null, lab:'spm'},
        {val: st.calories!=null ? Math.round(st.calories) : null, lab:'kcal'},
        {val: st.avg_heartrate!=null ? Math.round(st.avg_heartrate) : null, lab:'fc media'},
        {val: st.max_heartrate!=null ? Math.round(st.max_heartrate) : null, lab:'fc máx'},
        {val: st.date_short, lab:'fecha'}
      ].filter(s => s.val !== null && s.val !== undefined && s.val !== '');
      const outing = document.createElement('div');
      outing.className = 'outing';
      outing.innerHTML = stats.map(s=>`<div class="stat"><span class="val">${s.val}</span><span class="lab">${s.lab}</span></div>`).join('');
      card.appendChild(outing);
    }

    return card;
  }

  // ---- Configuración de Strava ----
  // Client ID de tu app de Strava (developer.strava.com) — este SÍ va en el navegador, no es secreto.
  const STRAVA_CLIENT_ID = 'PON_AQUI_TU_CLIENT_ID';
  const STRAVA_TOKEN_KEY = 'strava-tokens'; // {access_token, refresh_token, expires_at}

  function getStravaTokens(){
    try{ return JSON.parse(localStorage.getItem(STRAVA_TOKEN_KEY) || 'null'); }
    catch(e){ return null; }
  }
  function saveStravaTokens(t){
    localStorage.setItem(STRAVA_TOKEN_KEY, JSON.stringify(t));
  }
  function isStravaConnected(){
    return !!getStravaTokens();
  }
  function redirectToStravaAuth(){
    const redirectUri = window.location.origin + window.location.pathname;
    const url = 'https://www.strava.com/oauth/authorize'
      + '?client_id=' + encodeURIComponent(STRAVA_CLIENT_ID)
      + '&redirect_uri=' + encodeURIComponent(redirectUri)
      + '&response_type=code&approval_prompt=auto&scope=activity:read_all';
    window.location.href = url;
  }
  async function handleStravaAuthReturn(){
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    if(!code) return;
    try{
      const r = await fetch(`/api/strava-token?action=exchange&code=${encodeURIComponent(code)}`);
      const data = await r.json();
      if(r.ok){ saveStravaTokens(data); }
    }catch(e){ /* si falla, el usuario puede reintentar conectando de nuevo */ }
    // limpia el ?code= de la URL sin recargar
    window.history.replaceState({}, '', window.location.pathname);
  }
  async function ensureValidAccessToken(){
    let t = getStravaTokens();
    if(!t) return null;
    const now = Math.floor(Date.now()/1000);
    if(t.expires_at && t.expires_at > now + 60) return t.access_token;
    // token caducado (Strava los expira cada 6h): refrescar
    try{
      const r = await fetch(`/api/strava-token?action=refresh&refresh_token=${encodeURIComponent(t.refresh_token)}`);
      const data = await r.json();
      if(!r.ok) return null;
      saveStravaTokens(data);
      return data.access_token;
    }catch(e){ return null; }
  }

  function fmtDuration(sec){
    sec = Math.round(sec);
    const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
    const mm = String(m).padStart(h?2:1,'0'), ss = String(s).padStart(2,'0');
    return h ? `${h}:${String(m).padStart(2,'0')}:${ss}` : `${mm}:${ss}`;
  }
  function fmtPace(movingTimeSec, distanceM){
    if(!distanceM) return '—';
    const secPerKm = movingTimeSec / (distanceM/1000);
    const m = Math.floor(secPerKm/60), s = Math.round(secPerKm%60);
    return `${m}:${String(s).padStart(2,'0')}`;
  }

  function assignCandidate(sess, c){
    const d = new Date(c.date+'T00:00:00');
    state[sess.id] = {
      checked:true, source:'strava',
      date:c.date, distance_km:c.distance_km, pace_min_km:c.pace_min_km,
      duration:c.duration, elevation_gain_m:c.elevation_gain_m,
      cadence_spm:c.cadence_spm, calories:c.calories,
      avg_heartrate:c.avg_heartrate, max_heartrate:c.max_heartrate,
      date_short:d.toLocaleDateString('es-ES',{day:'numeric',month:'short'})
    };
    saveState(); renderAll();
  }

  async function fetchStravaWeek(week){
    const token = await ensureValidAccessToken();
    if(!token){ weekStravaStatus[week.n] = {text:'No conectado a Strava', err:true}; return; }
    try{
      const afterEpoch = Math.floor(new Date(week.start+'T00:00:00').getTime()/1000);
      const beforeEpoch = Math.floor(new Date(week.end+'T23:59:59').getTime()/1000);
      const listRes = await fetch(`/api/strava-activities?after=${afterEpoch}&before=${beforeEpoch}`, {
        headers:{ Authorization: `Bearer ${token}` }
      });
      const list = await listRes.json();
      if(!listRes.ok) throw new Error(list.error || list.message || 'Error consultando Strava');

      const runs = (Array.isArray(list) ? list : []).filter(a => a.type === 'Run' || a.sport_type === 'Run');

      const activities = [];
      for(const a of runs){
        // pedimos el detalle de cada carrera para tener calorías y confirmar pulso
        let detail = a;
        try{
          const dRes = await fetch(`/api/strava-activity-detail?id=${a.id}`, {
            headers:{ Authorization: `Bearer ${token}` }
          });
          if(dRes.ok) detail = await dRes.json();
        }catch(e){ /* si falla el detalle, seguimos con los datos del listado */ }

        activities.push({
          date: (a.start_date_local || a.start_date || '').slice(0,10),
          distance_km: a.distance / 1000,
          pace_min_km: fmtPace(a.moving_time, a.distance),
          duration: fmtDuration(a.moving_time),
          elevation_gain_m: a.total_elevation_gain,
          cadence_spm: a.average_cadence != null ? a.average_cadence * 2 : null,
          calories: detail.calories != null ? detail.calories : null,
          avg_heartrate: a.has_heartrate ? a.average_heartrate : null,
          max_heartrate: a.has_heartrate ? a.max_heartrate : null
        });
      }
      weekCandidates[week.n] = activities;
      weekStravaStatus[week.n] = {text:'', err:false};
    }catch(e){
      weekStravaStatus[week.n] = {text: `No se ha podido consultar Strava: ${e.message}`, err:true};
    }
  }

  function closeModal(){
    document.getElementById('modal-overlay').style.display = 'none';
  }

  function showStravaModal(sess, week){
    if(!isStravaConnected()){
      redirectToStravaAuth();
      return;
    }
    const overlay = document.getElementById('modal-overlay');
    const title = document.getElementById('modal-title');
    const body = document.getElementById('modal-body');
    title.textContent = `Strava · ${week.dates}`;
    document.getElementById('modal-close').onclick = closeModal;
    overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
    overlay.style.display = 'flex';

    function renderList(){
      const candidates = weekCandidates[week.n] || [];
      if(!candidates.length){
        body.innerHTML = '<p class="modal-empty">No hay carreras de Strava para estos días.</p>';
        return;
      }
      body.innerHTML = '';
      candidates.forEach(c=>{
        const b = document.createElement('button');
        b.className = 'modal-item';
        b.textContent = formatCandidate(c);
        b.onclick = ()=>{ closeModal(); assignCandidate(sess, c); };
        body.appendChild(b);
      });
    }

    function renderError(){
      body.innerHTML = '';
      const p = document.createElement('p');
      p.className = 'modal-error';
      p.textContent = weekStravaStatus[week.n].text;
      body.appendChild(p);
      const retry = document.createElement('button');
      retry.className = 'modal-item';
      retry.textContent = 'Reintentar';
      retry.onclick = async ()=>{
        body.innerHTML = '<p class="modal-loading">Buscando en Strava…</p>';
        await fetchStravaWeek(week);
        if(weekStravaStatus[week.n] && weekStravaStatus[week.n].err) renderError(); else renderList();
      };
      body.appendChild(retry);
    }

    if(weekCandidates[week.n]){
      renderList();
    } else {
      body.innerHTML = '<p class="modal-loading">Buscando en Strava…</p>';
      fetchStravaWeek(week).then(()=>{
        if(weekStravaStatus[week.n] && weekStravaStatus[week.n].err) renderError(); else renderList();
      });
    }
  }

  function renderWeekPanel(){
    const week = PLAN.find(w=>w.n===currentWeek);
    const panel = document.getElementById('week-panel');
    panel.innerHTML = '';

    const head = document.createElement('div');
    head.className = 'week-head';
    head.innerHTML = `<p class="eyebrow">Semana ${week.n} · ${week.phase}</p>
      <h2 class="week-title">${week.dates}</h2>`;
    panel.appendChild(head);

    const stravaRow = document.createElement('div');
    stravaRow.className = 'strava-row';
    if(weekStravaStatus[week.n] && weekStravaStatus[week.n].err && weekStravaStatus[week.n].text){
      const status = document.createElement('span');
      status.className = 'strava-status err';
      status.textContent = weekStravaStatus[week.n].text;
      stravaRow.appendChild(status);
      panel.appendChild(stravaRow);
    }

    week.sessions.forEach(sess=>{
      panel.appendChild(sessionCard(sess, week, false));
    });

    if(week.raceSession){
      panel.appendChild(sessionCard(week.raceSession, week, true));
    }
  }

  function renderAll(){
    renderCountdown();
    renderRail();
    renderWeekPanel();
  }

  (async function init(){
    loadState();
    currentWeek = pickCurrentWeek();
    await handleStravaAuthReturn();
    renderAll();
  })();
})();
</script>
</body>
</html>
